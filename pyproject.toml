[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastapi-docshield"
dynamic = ["version"]
description = "Protect FastAPI's /docs, /redoc and /openapi.json with HTTP Basic Auth or a login page"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
authors = [
    {name = "George Khananaev", email = "106206490+georgekhananaev@users.noreply.github.com"},
]
keywords = ["fastapi", "authentication", "documentation", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.68.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.23.0",
    "requests>=2.28.0",
    "uvicorn>=0.18.0",
    "ruff>=0.6.0",
]

[project.urls]
"Homepage" = "https://github.com/georgekhananaev/fastapi-docshield"
"Bug Tracker" = "https://github.com/georgekhananaev/fastapi-docshield/issues"
"Documentation" = "https://github.com/georgekhananaev/fastapi-docshield#readme"
"Source Code" = "https://github.com/georgekhananaev/fastapi-docshield"
"Changelog" = "https://github.com/georgekhananaev/fastapi-docshield/blob/master/CHANGELOG.md"

[tool.hatch.version]
path = "fastapi_docshield/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["fastapi_docshield"]

[tool.hatch.build.targets.sdist]
include = [
    "fastapi_docshield",
    "tests",
    "CHANGELOG.md",
    "LICENSE",
    "README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["fastapi_docshield"]

[tool.ruff]
target-version = "py38"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
