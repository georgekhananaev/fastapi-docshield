name: Python Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[dev]"

    - name: Test with pytest
      run: |
        pytest --cov=fastapi_docshield

  test-oldest:
    name: test (oldest FastAPI)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python 3.8
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.8"

    # The oldest FastAPI the package supports, with the test client of its time
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install "fastapi==0.68.0" pytest requests uvicorn
        python -m pip install -e .

    - name: Test with pytest
      run: |
        python -c "import fastapi; assert fastapi.__version__ == '0.68.0', fastapi.__version__"
        pytest

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"

    - name: Install tools
      run: |
        python -m pip install --upgrade pip
        python -m pip install ruff build twine

    - name: Lint
      run: |
        ruff check .
        ruff format --check .

    - name: Build and check package
      run: |
        python -m build
        twine check dist/*
